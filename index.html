<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Almoxarifado Transpetro - Acesso</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    
    <!-- Ícones FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark-blue: #003B5C;
            --primary-color: #003B5C;
            --btn-green: #107C41;
            --btn-green-hover: #0b5c30;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1f2937;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --footer-text: #6b7280;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* BANNER DE FUNDO (IGUAL À FOTO 1 - ALMOXARIFADO) */
        body {
            background: linear-gradient(rgba(0, 40, 64, 0.65), rgba(0, 40, 64, 0.65)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARD CENTRALIZADO NOVO (DESIGNS DA FOTO) */
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .brand-header {
            margin-bottom: 25px;
        }

        .brand-header i {
            font-size: 38px;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-header p {
            font-size: 13px;
            color: #555;
            font-weight: 600;
            margin-top: 2px;
        }

        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }

        label { 
            font-size: 12px; 
            font-weight: bold; 
            color: #444; 
            display: block; 
            margin-bottom: 6px; 
            text-transform: uppercase;
        }

        input {
            width: 100%; 
            background: var(--input-bg); 
            border: 1px solid var(--input-border);
            padding: 12px 14px; 
            border-radius: 6px; 
            color: var(--text-color); 
            outline: none;
            font-size: 14px;
        }

        input:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 2px rgba(0, 59, 92, 0.2);
        }

        .btn-acao {
            width: 100%; 
            background: var(--primary-color); 
            color: white; 
            border: none;
            padding: 14px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-acao:hover {
            background: #002840;
        }

        .btn-toggle {
            background: transparent; 
            color: var(--primary-color); 
            border: none;
            font-size: 13px; 
            cursor: pointer; 
            text-decoration: underline;
            font-weight: 600;
        }

        .rodape-login {
            margin-top: 25px;
            font-size: 11px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
        }

        .aviso-restrito {
            color: #fca5a5;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        /* MODAL ALERTA PERSONALIZADO */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #ffffff; padding: 25px; border-radius: 12px; max-width: 340px; text-align: center; border: 1px solid var(--input-border);
        }
        .modal-btn { background: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- MARCA IGUAL À FOTO 1 DO LAYOUT -->
        <div class="brand-header">
            <i class="fa-solid fa-warehouse"></i>
            <h1>Transpetro</h1>
            <p id="tituloTela">WMS ALMOXARIFADO TRANSPETRO</p>
        </div>
        
        <!-- FORMULÁRIO COM A SUA LÓGICA INTEGRA -->
        <form id="authForm">
            <div class="form-group">
                <label>E-mail Corporativo:</label>
                <input type="email" id="email" placeholder="Login: email@transpetro.com.br" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Senha do Sistema:</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-acao" id="btnPrincipal">Entrar no Sistema</button>
            <button type="button" class="btn-toggle" id="btnToggle" onclick="alternarModo()">Não tem conta? Criar Acesso</button>
        </form>
    </div>

    <!-- RODAPÉ DE DIREITOS E AUTORIA -->
    <div class="rodape-login">
        &copy; 2026 WMS Inteligente. Todos os direitos reservados.<br>
        Projeto independente desenvolvido por <strong>Dário João Torres</strong>.<br>
        <span class="aviso-restrito">⚠️ Uso autorizado apenas para e-mails institucionais da Transpetro.</span>
    </div>

    <!-- CAIXA DE ALERTA -->
    <div id="customAlert" class="modal">
        <div class="modal-content">
            <div id="alertMsg" style="font-size: 14px; color: #333; white-space: pre-line;"></div>
            <button class="modal-btn" onclick="fecharAlerta()">OK</button>
        </div>
    </div>

    <!-- TODA A SUA LÓGICA DE JAVASCRIPT PRESERVADA 100% -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCI5iG3O0IRdrOiFR50WsCi1L0Werlfcnw",
            authDomain: "bolao-copa-2026-d264f.firebaseapp.com",
            projectId: "bolao-copa-2026-d264f",
            storageBucket: "bolao-copa-2026-d264f.firebasestorage.app",
            messagingSenderId: "802924891915",
            appId: "1:802924891915:web:d9c641161733b510559c0e",
            measurementId: "G-QQ210F367M"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const ADM_EMAIL = "joao-torres33@live.com";
        let modoLogin = true;

        function exibirAlerta(msg) {
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('customAlert').style.display = 'flex';
        }

        function fecharAlerta() {
            document.getElementById('customAlert').style.display = 'none';
        }

        function alternarModo() {
            modoLogin = !modoLogin;
            document.getElementById('tituloTela').innerText = modoLogin ? "WMS ALMOXARIFADO TRANSPETRO" : "CRIAR NOVO ACESSO";
            document.getElementById('btnPrincipal').innerText = modoLogin ? "Entrar no Sistema" : "Cadastrar Agora";
            document.getElementById('btnToggle').innerText = modoLogin ? "Não tem conta? Criar Acesso" : "Já tenho conta. Entrar";
        }

        async function obterDadosSeguranca() {
            let ip = "Desconhecido";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) {}
            return {
                ip: ip,
                dispositivo: navigator.userAgent,
                dataAcesso: new Date().toLocaleString('pt-BR'),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btnPrincipal');

            btn.disabled = true;
            btn.innerText = "Processando...";

            // Trava de Domínio
            if (email !== ADM_EMAIL && !email.endsWith("@transpetro.com.br")) {
                exibirAlerta("❌ ACESSO NEGADO!\n\nUtilize seu e-mail institucional @transpetro.com.br.");
                btn.disabled = false;
                btn.innerText = modoLogin ? "Entrar no Sistema" : "Cadastrar Agora";
                return;
            }

            const dadosSeg = await obterDadosSeguranca();

            try {
                if (modoLogin) {
                    // LOGIN
                    const userCredential = await auth.signInWithEmailAndPassword(email, senha);
                    
                    // Busca perfil no Firestore
                    let perfilUsuario = "OPERACIONAL";
                    if (email === ADM_EMAIL) {
                        perfilUsuario = "ADMIN";
                    } else {
                        const userDoc = await db.collection("usuarios").doc(email).get();
                        if (userDoc.exists && (userDoc.data().perfil === "GERENCIAL" || userDoc.data().perfil === "ADMIN")) {
                            perfilUsuario = "ADMIN";
                        }
                    }

                    // 🔑 GRAVA SESSÃO NO LOCALSTORAGE
                    localStorage.setItem('wms_usuario', email);
                    localStorage.setItem('wms_perfil', perfilUsuario);

                    await db.collection("logs_acesso").add({ usuario: email, status: "LOGIN_SUCESSO", ...dadosSeg });
                    exibirAlerta(`🔓 Bem-vindo!\nAcesso liberado.`);
                    
                    // Redireciona para a tela do Menu/Dashboard principal
                    setTimeout(() => { 
                        window.location.replace('menu.html'); 
                    }, 1000);

                } else {
                    // CADASTRO
                    await auth.createUserWithEmailAndPassword(email, senha);
                    const perfilDefinido = (email === ADM_EMAIL ? "GERENCIAL" : "OPERACIONAL");
                    
                    await db.collection("usuarios").doc(email).set({
                        email: email,
                        perfil: perfilDefinido,
                        dataCadastro: new Date().toISOString()
                    });

                    await db.collection("logs_acesso").add({ usuario: email, status: "CADASTRO_SUCESSO", ...dadosSeg });
                    exibirAlerta("✅ Cadastro realizado!\nAgora você já pode entrar.");
                    alternarModo();
                }
            } catch (error) {
                let msgErro = "Ocorreu um erro. Verifique seus dados.";
                if (error.code === "auth/email-already-in-use") msgErro = "Este e-mail já está em uso.";
                if (error.code === "auth/wrong-password") msgErro = "Senha incorreta.";
                if (error.code === "auth/user-not-found") msgErro = "Usuário não encontrado.";
                
                await db.collection("logs_acesso").add({ usuario: email, status: "ERRO", erro: error.code, ...dadosSeg });
                exibirAlerta("❌ " + msgErro);
            }

            btn.disabled = false;
            btn.innerText = modoLogin ? "Entrar no Sistema" : "Cadastrar Agora";
        });

        // Garante que os campos comecem limpos
        window.onload = () => {
            document.getElementById('email').value = "";
            document.getElementById('senha').value = "";
        };
    </script>
</body>
</html>
